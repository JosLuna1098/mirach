name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Mirach is a Linux-only daemon (systemd, notify-send, CUDA) reached over a
    # local network by the web widget and the Android app. Windows/macOS were
    # dropped from the matrix: their only failures were CRLF/path artifacts
    # irrelevant to the supported platform.
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install PortAudio (Linux runtime dep for sounddevice)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install package (CPU-only, dev extras)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show environment
        shell: bash
        run: |
          python --version
          pip list

      - name: Run pytest
        shell: bash
        run: pytest -v

      - name: Lint (ruff)
        if: matrix.python == '3.12'
        shell: bash
        run: |
          ruff check .
          ruff format --check .
